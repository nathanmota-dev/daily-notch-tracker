name: PR Quality Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: quality-gate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Audit & Quality Metrics
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: rust-workflows
          cache-workspace-crates: true

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Select trusted quality baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          baseline_path="$RUNNER_TEMP/quality-gate-baseline.json"
          if git cat-file -e "${BASE_SHA}:scripts/baseline.json"; then
            git show "${BASE_SHA}:scripts/baseline.json" > "$baseline_path"
            echo "QUALITY_GATE_BASELINE_PATH=$baseline_path" >> "$GITHUB_ENV"
            echo "QUALITY_GATE_BASELINE_LABEL=main@${BASE_SHA:0:12}:scripts/baseline.json" >> "$GITHUB_ENV"
            echo "QUALITY_GATE_BASELINE_TRUSTED=true" >> "$GITHUB_ENV"
          else
            echo "QUALITY_GATE_BASELINE_PATH=$GITHUB_WORKSPACE/scripts/baseline.json" >> "$GITHUB_ENV"
            echo "QUALITY_GATE_BASELINE_LABEL=bootstrap:scripts/baseline.json" >> "$GITHUB_ENV"
            echo "QUALITY_GATE_BASELINE_TRUSTED=false" >> "$GITHUB_ENV"
            echo "::notice::The base branch has no quality baseline; capturing a non-blocking bootstrap reference."
          fi

      - name: Install Node dependencies
        id: install_node
        continue-on-error: true
        run: npm ci

      - name: Install Tauri system dependencies
        id: install_tauri_dependencies
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget

      - name: Critical vulnerability audit
        id: audit_critical
        if: always() && steps.install_node.outcome == 'success'
        continue-on-error: true
        run: npm audit --audit-level=critical | tee reports/npm-audit-critical.txt

      - name: High vulnerability audit (warning only)
        id: audit_high
        if: always() && steps.install_node.outcome == 'success'
        continue-on-error: true
        run: npm audit --audit-level=high | tee reports/npm-audit-high.txt

      - name: Frontend build
        id: frontend_build
        if: always() && steps.install_node.outcome == 'success'
        continue-on-error: true
        run: npm run build

      - name: Frontend lint
        id: frontend_lint
        if: always() && steps.install_node.outcome == 'success'
        continue-on-error: true
        run: npm run lint -- --max-warnings=0

      - name: Frontend typecheck
        id: frontend_typecheck
        if: always() && steps.install_node.outcome == 'success'
        continue-on-error: true
        run: npm run typecheck

      - name: Frontend tests with coverage
        id: frontend_coverage
        if: always() && steps.install_node.outcome == 'success'
        continue-on-error: true
        run: npm run test:coverage:ci

      - name: Rust formatting
        id: rust_format
        if: always()
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust Clippy
        id: rust_clippy
        if: always() && steps.install_tauri_dependencies.outcome == 'success'
        continue-on-error: true
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

      - name: Rust tests
        id: rust_tests
        if: always() && steps.install_tauri_dependencies.outcome == 'success'
        continue-on-error: true
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Test quality gate
        id: quality_gate_tests
        if: always()
        continue-on-error: true
        run: node --test scripts/quality-gate.test.js scripts/pr-report.test.js

      - name: Collect and compare quality metrics
        id: quality_gate
        if: >-
          always()
          && steps.install_node.outcome == 'success'
          && steps.frontend_coverage.outcome == 'success'
        continue-on-error: true
        run: |
          args=()
          if [[ "$QUALITY_GATE_BASELINE_TRUSTED" != "true" ]]; then
            args+=(--bootstrap)
          fi
          node scripts/quality-gate.js "${args[@]}"

      - name: Compose PR quality report
        if: always()
        env:
          INSTALL_NODE: ${{ steps.install_node.outcome }}
          INSTALL_TAURI_DEPENDENCIES: ${{ steps.install_tauri_dependencies.outcome }}
          AUDIT_CRITICAL: ${{ steps.audit_critical.outcome }}
          AUDIT_HIGH: ${{ steps.audit_high.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
          FRONTEND_LINT: ${{ steps.frontend_lint.outcome }}
          FRONTEND_TYPECHECK: ${{ steps.frontend_typecheck.outcome }}
          FRONTEND_COVERAGE: ${{ steps.frontend_coverage.outcome }}
          RUST_FORMAT: ${{ steps.rust_format.outcome }}
          RUST_CLIPPY: ${{ steps.rust_clippy.outcome }}
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
          QUALITY_GATE_TESTS: ${{ steps.quality_gate_tests.outcome }}
          QUALITY_GATE: ${{ steps.quality_gate.outcome }}
        run: |
          failures=()
          [[ "$INSTALL_NODE" == "success" ]] || failures+=("npm ci")
          [[ "$INSTALL_TAURI_DEPENDENCIES" == "success" ]] || failures+=("Tauri system dependencies")
          [[ "$AUDIT_CRITICAL" == "success" ]] || failures+=("critical npm audit")
          [[ "$FRONTEND_BUILD" == "success" ]] || failures+=("frontend build")
          [[ "$FRONTEND_LINT" == "success" ]] || failures+=("frontend lint")
          [[ "$FRONTEND_TYPECHECK" == "success" ]] || failures+=("frontend typecheck")
          [[ "$FRONTEND_COVERAGE" == "success" ]] || failures+=("frontend coverage")
          [[ "$RUST_FORMAT" == "success" ]] || failures+=("Rust formatting")
          [[ "$RUST_CLIPPY" == "success" ]] || failures+=("Rust Clippy")
          [[ "$RUST_TESTS" == "success" ]] || failures+=("Rust tests")
          [[ "$QUALITY_GATE_TESTS" == "success" ]] || failures+=("quality-gate tests")
          [[ "$QUALITY_GATE" == "success" ]] || failures+=("quality metric comparison")

          report="reports/quality-gate.md"
          composed="reports/pr-quality-gate.md"
          {
            echo "# PR Quality Gate"
            echo
            if (( ${#failures[@]} == 0 )); then
              echo "✅ **PASS** — All blocking quality checks passed."
            else
              echo "❌ **FAIL** — Blocking checks failed: ${failures[*]}."
            fi
            echo
            echo "## Workflow checks"
            echo
            echo "| Check | Result | Blocking |"
            echo "|---|---|---:|"
            echo "| npm ci | \`$INSTALL_NODE\` | Yes |"
            echo "| Tauri system dependencies | \`$INSTALL_TAURI_DEPENDENCIES\` | Yes |"
            echo "| Critical npm audit | \`$AUDIT_CRITICAL\` | Yes |"
            echo "| High npm audit | \`$AUDIT_HIGH\` | No (warning) |"
            echo "| Frontend build | \`$FRONTEND_BUILD\` | Yes |"
            echo "| Frontend lint | \`$FRONTEND_LINT\` | Yes |"
            echo "| Frontend typecheck | \`$FRONTEND_TYPECHECK\` | Yes |"
            echo "| Frontend coverage | \`$FRONTEND_COVERAGE\` | Yes |"
            echo "| Rust formatting | \`$RUST_FORMAT\` | Yes |"
            echo "| Rust Clippy | \`$RUST_CLIPPY\` | Yes |"
            echo "| Rust tests | \`$RUST_TESTS\` | Yes |"
            echo "| Quality-gate tests | \`$QUALITY_GATE_TESTS\` | Yes |"
            echo "| Quality metric comparison/bootstrap | \`$QUALITY_GATE\` | Yes |"
            echo
            echo "---"
            echo
            if [[ -f "$report" ]]; then
              cat "$report"
            else
              echo "The metric report was not generated. Inspect the failed steps above."
            fi
          } > "$composed"

          node <<'NODE'
          const fs = require("node:fs");

          const checks = [
            ["npm ci", process.env.INSTALL_NODE, true, "always"],
            ["Tauri system dependencies", process.env.INSTALL_TAURI_DEPENDENCIES, true, "always"],
            ["Critical npm audit", process.env.AUDIT_CRITICAL, true, "always"],
            ["High npm audit", process.env.AUDIT_HIGH, false, "warning-only"],
            ["Frontend build", process.env.FRONTEND_BUILD, true, "always"],
            ["Frontend lint", process.env.FRONTEND_LINT, true, "always"],
            ["Frontend typecheck", process.env.FRONTEND_TYPECHECK, true, "always"],
            ["Frontend coverage", process.env.FRONTEND_COVERAGE, true, "always"],
            ["Rust formatting", process.env.RUST_FORMAT, true, "always"],
            ["Rust Clippy", process.env.RUST_CLIPPY, true, "always"],
            ["Rust tests", process.env.RUST_TESTS, true, "always"],
            ["Quality-gate tests", process.env.QUALITY_GATE_TESTS, true, "always"],
            ["Quality metric comparison/bootstrap", process.env.QUALITY_GATE, true, "always"],
          ].map(([name, outcome, blocking, blockingRule]) => ({
            name,
            outcome: outcome || "unknown",
            selected: true,
            blocking,
            blockingRule,
            result: outcome === "success"
              ? "PASS"
              : outcome === "skipped"
                ? "SKIPPED"
                : blocking
                  ? "FAIL"
                  : "WARNING",
          }));

          const overall = checks.some((check) => check.blocking && check.result === "FAIL") ? "FAIL" : "PASS";
          fs.writeFileSync(
            "reports/quality-workflow.json",
            `${JSON.stringify({ schemaVersion: 1, workflow: "Quality Gate", overall, checks }, null, 2)}\n`,
            "utf8",
          );
          NODE

      - name: Publish job summary
        if: always()
        run: cat reports/pr-quality-gate.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            coverage/
            reports/

      - name: Enforce blocking quality checks
        if: always()
        env:
          INSTALL_NODE: ${{ steps.install_node.outcome }}
          INSTALL_TAURI_DEPENDENCIES: ${{ steps.install_tauri_dependencies.outcome }}
          AUDIT_CRITICAL: ${{ steps.audit_critical.outcome }}
          FRONTEND_BUILD: ${{ steps.frontend_build.outcome }}
          FRONTEND_LINT: ${{ steps.frontend_lint.outcome }}
          FRONTEND_TYPECHECK: ${{ steps.frontend_typecheck.outcome }}
          FRONTEND_COVERAGE: ${{ steps.frontend_coverage.outcome }}
          RUST_FORMAT: ${{ steps.rust_format.outcome }}
          RUST_CLIPPY: ${{ steps.rust_clippy.outcome }}
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
          QUALITY_GATE_TESTS: ${{ steps.quality_gate_tests.outcome }}
          QUALITY_GATE: ${{ steps.quality_gate.outcome }}
        run: |
          failures=()
          [[ "$INSTALL_NODE" == "success" ]] || failures+=("npm ci")
          [[ "$INSTALL_TAURI_DEPENDENCIES" == "success" ]] || failures+=("Tauri system dependencies")
          [[ "$AUDIT_CRITICAL" == "success" ]] || failures+=("critical npm audit")
          [[ "$FRONTEND_BUILD" == "success" ]] || failures+=("frontend build")
          [[ "$FRONTEND_LINT" == "success" ]] || failures+=("frontend lint")
          [[ "$FRONTEND_TYPECHECK" == "success" ]] || failures+=("frontend typecheck")
          [[ "$FRONTEND_COVERAGE" == "success" ]] || failures+=("frontend coverage")
          [[ "$RUST_FORMAT" == "success" ]] || failures+=("Rust formatting")
          [[ "$RUST_CLIPPY" == "success" ]] || failures+=("Rust Clippy")
          [[ "$RUST_TESTS" == "success" ]] || failures+=("Rust tests")
          [[ "$QUALITY_GATE_TESTS" == "success" ]] || failures+=("quality-gate tests")
          [[ "$QUALITY_GATE" == "success" ]] || failures+=("quality metric comparison")
          if (( ${#failures[@]} > 0 )); then
            printf 'Blocking quality checks failed: %s\n' "${failures[*]}"
            exit 1
          fi

  report:
    name: Publish consolidated PR report
    if: >-
      always()
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && github.actor != 'dependabot[bot]'
    needs: evaluate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download quality report artifact
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: quality-gate-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-artifact

      - name: Wait for matching performance workflow
        id: performance_run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        shell: bash
        run: |
          set +e
          run_id=""
          run_attempt=""
          run_status="timeout"
          run_conclusion=""
          completed=false
          deadline=$((SECONDS + 600))

          while (( SECONDS < deadline )); do
            runs=$(gh api --method GET \
              "repos/${REPOSITORY}/actions/workflows/performance.yml/runs" \
              -f event=pull_request \
              -f head_sha="$HEAD_SHA" \
              -f per_page=100 2>/dev/null)
            if [[ $? -ne 0 ]]; then
              runs='{"workflow_runs":[]}'
            fi

            candidate=$(jq -c --arg sha "$HEAD_SHA" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by([.created_at, .id])
              | last // empty
            ' <<< "$runs" 2>/dev/null)

            if [[ -n "$candidate" ]]; then
              run_id=$(jq -r '.id' <<< "$candidate")
              run_attempt=$(jq -r '.run_attempt // empty' <<< "$candidate")
              run_status=$(jq -r '.status' <<< "$candidate")
              run_conclusion=$(jq -r '.conclusion // empty' <<< "$candidate")
              if [[ "$run_status" == "completed" ]]; then
                completed=true
                break
              fi
            fi

            sleep 15
          done

          if [[ "$completed" != "true" ]]; then
            run_status="timeout"
          fi

          if [[ -n "$run_id" ]]; then
            workflow_url="${SERVER_URL}/${REPOSITORY}/actions/runs/${run_id}"
          else
            workflow_url="${SERVER_URL}/${REPOSITORY}/actions/workflows/performance.yml"
          fi

          {
            echo "run_id=$run_id"
            echo "run_attempt=$run_attempt"
            echo "status=$run_status"
            echo "conclusion=$run_conclusion"
            echo "workflow_url=$workflow_url"
          } >> "$GITHUB_OUTPUT"

      - name: Download matching performance report artifact
        if: steps.performance_run.outputs.run_id != '' && steps.performance_run.outputs.run_attempt != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: performance-pr-${{ github.event.pull_request.number }}-${{ steps.performance_run.outputs.run_id }}-${{ steps.performance_run.outputs.run_attempt }}
          path: performance-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.performance_run.outputs.run_id }}

      - name: Render consolidated PR report
        if: always()
        env:
          QUALITY_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          QUALITY_WORKFLOW_CONCLUSION: ${{ needs.evaluate.result }}
          PERFORMANCE_WORKFLOW_URL: ${{ steps.performance_run.outputs.workflow_url }}
          PERFORMANCE_WORKFLOW_STATUS: ${{ steps.performance_run.outputs.status }}
          PERFORMANCE_WORKFLOW_CONCLUSION: ${{ steps.performance_run.outputs.conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          quality_report=$(find quality-artifact -type f -name quality-gate.md -print -quit 2>/dev/null || true)
          quality_manifest=$(find quality-artifact -type f -name quality-workflow.json -print -quit 2>/dev/null || true)
          performance_report=$(find performance-artifact -type f -name performance.md -print -quit 2>/dev/null || true)
          performance_manifest=$(find performance-artifact -type f -name performance-workflow.json -print -quit 2>/dev/null || true)

          mkdir -p reports
          node scripts/pr-report.js \
            --quality-report "$quality_report" \
            --performance-report "$performance_report" \
            --quality-manifest "$quality_manifest" \
            --performance-manifest "$performance_manifest" \
            --quality-workflow-url "$QUALITY_WORKFLOW_URL" \
            --performance-workflow-url "$PERFORMANCE_WORKFLOW_URL" \
            --quality-conclusion "$QUALITY_WORKFLOW_CONCLUSION" \
            --performance-status "$PERFORMANCE_WORKFLOW_STATUS" \
            --performance-conclusion "$PERFORMANCE_WORKFLOW_CONCLUSION" \
            --output reports/pr-report.md

      - name: Create or update sticky PR report comment
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          COMMENT_MARKER: "<!-- daily-notch-tracker-pr-report -->"
          RUNNER_TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          comment_body=$(<reports/pr-report.md)
          comments_file="$RUNNER_TEMP/pr-comments.ndjson"

          gh api --paginate \
            "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[]' > "$comments_file"

          mapfile -t sticky_comments < <(
            jq -r --arg marker "$COMMENT_MARKER" \
              'select(.user.type == "Bot" and (.body | contains($marker))) | .id' \
              "$comments_file"
          )

          comment_id=""
          if (( ${#sticky_comments[@]} > 0 )); then
            comment_id="${sticky_comments[0]}"
            gh api --method PATCH \
              "repos/${REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$comment_body" >/dev/null

            for duplicate_id in "${sticky_comments[@]:1}"; do
              gh api --method DELETE \
                "repos/${REPOSITORY}/issues/comments/${duplicate_id}" >/dev/null
            done
          else
            response=$(gh api --method POST \
              "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$comment_body")
            comment_id=$(jq -r '.id' <<< "$response")
          fi

          legacy_markers=(
            "<!-- daily-notch-tracker-quality-gate -->"
            "<!-- daily-notch-tracker-performance -->"
            "<!-- daily-notch-tracker-quality-report -->"
            "<!-- daily-notch-tracker-performance-report -->"
          )
          for legacy_marker in "${legacy_markers[@]}"; do
            mapfile -t legacy_comments < <(
              jq -r --arg marker "$legacy_marker" --arg stable "$COMMENT_MARKER" \
                'select(.user.type == "Bot" and (.body | contains($marker)) and ((.body | contains($stable)) | not)) | .id' \
                "$comments_file"
            )
            for legacy_id in "${legacy_comments[@]}"; do
              gh api --method DELETE \
                "repos/${REPOSITORY}/issues/comments/${legacy_id}" >/dev/null
            done
          done

          echo "Sticky PR report comment: ${comment_id}"
