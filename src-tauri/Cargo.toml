[package]
name = "dailynotch"
version = "0.1.0"
description = "DailyNotch Linux"
authors = ["DailyNotch"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dailynotch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "commands"
harness = false
